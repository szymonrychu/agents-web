image:
  repository: harbor.szymonrichert.pl/containers/agents-web
  # Required: the render fails while this is empty.
  tag: ""
  pullPolicy: IfNotPresent

# Merged with global.imagePullSecrets.
imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

replicaCount: 1

podAnnotations: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 101
  runAsGroup: 101
  fsGroup: 101
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

resources: {}

livenessProbe:
  httpGet:
    path: /healthz
    port: 8080
readinessProbe:
  httpGet:
    path: /healthz
    port: 8080

service:
  type: ClusterIP
  port: 8080

# Runtime config served as /config.json (same rules as src/config/backends.ts:parseConfig):
# each entry needs a unique id matching ^[a-z][a-z0-9-]*$, a non-empty label and a basePath that starts
# with "/", does not end with "/" and contains none of "//", "://", "?", "#"; one entry must have id "orchestrator".
backends:
  - id: orchestrator
    label: Orchestrator
    basePath: /api/v1

# The UI owns "/" of the host. See README "URL layout".
ingress:
  enabled: false
  className: ""
  annotations: {}
  # Source CIDRs the ingress refuses (ingress-nginx denylist annotation when non-empty).
  denySourceRanges: []
  # Source CIDRs the ingress admits (ingress-nginx allow-list annotation when non-empty).
  allowSourceRanges: []
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: Prefix
  tls: []
    # - secretName: chart-example-tls
    #   hosts:
    #     - chart-example.local

# The `helm test` pod. It reaches nginx through its own Service (numeric targetPort 8080), so an
# injected auth sidecar on the main Service does not redirect it. `port` is that Service's port.
test:
  port: 8080
  image: busybox:1.37.0
