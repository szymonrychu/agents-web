apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "agents-web.fullname" . }}-test-connection"
  labels:
    {{- include "agents-web.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
spec:
  {{- include "agents-web.imagePullSecrets" . | nindent 2 }}
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 65534
    runAsGroup: 65534
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: wget
      image: "{{ .Values.test.image }}"
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop:
            - ALL
      command: ['sh', '-c']
      args:
        - >-
          wget -qO- {{ include "agents-web.fullname" . }}:{{ .Values.service.port }}/healthz &&
          wget -qO- {{ include "agents-web.fullname" . }}:{{ .Values.service.port }}/config.json
  restartPolicy: Never
