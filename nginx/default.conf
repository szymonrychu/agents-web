server {
    listen 8080;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # Static site: only GET and HEAD.
    if ($request_method !~ ^(GET|HEAD)$) {
        return 405;
    }
    error_page 405 @method_not_allowed;

    location @method_not_allowed {
        add_header Allow "GET, HEAD" always;
        return 405;
    }

    location = /healthz {
        default_type text/plain;
        add_header Cache-Control "no-store";
        return 200 "ok";
    }

    # Another backend's path that reaches this pod is an error, never the SPA.
    location ~ ^/([^/]+/)?api(/|$) {
        default_type application/json;
        return 404 '{"error":{"code":"not_found","message":"not found"}}';
    }

    # Hashed build output: immutable, and no SPA fallback for missing files.
    location ^~ /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location = /config.json {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # index.html and every client route.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
